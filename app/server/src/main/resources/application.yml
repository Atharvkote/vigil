spring:
  application:
    name: vigil-sense
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vigilsense}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:atharva}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

vigilsense:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  weather:
    base-url: ${WEATHER_API_BASE_URL:https://api.open-meteo.com}
    connect-timeout: 5s
    read-timeout: 10s
    stale-after: 30m

resilience4j.retry:
  instances:
    weatherApi:
      maxAttempts: 3
      waitDuration: 1s
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2

resilience4j.ratelimiter:
  instances:
    weatherApi:
      limitForPeriod: 10
      limitRefreshPeriod: 1s
      timeoutDuration: 500ms

resilience4j.circuitbreaker:
  instances:
    weatherApi:
      slidingWindowSize: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
